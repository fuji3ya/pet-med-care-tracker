          sed -i.bak "s|\"_developerTeamID\": \"TEAMID\"|\"_developerTeamID\": \"$APPLE_TEAM_ID\"|" ios-app/StoreKit/TendPets.storekit
          sed -i.bak "s|\"_applicationInternalID\": \"1234567890\"|\"_applicationInternalID\": \"$APP_STORE_APPLE_ID\"|" ios-app/StoreKit/TendPets.storekit
          rm -f ios-app/project.yml.bak ios-app/StoreKit/TendPets.storekit.bak
