workflows:
  ios-testflight:
    name: Tend Pets iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tendpets.app
      vars:
        BUNDLE_ID: "com.tendpets.app"
        XCODE_PROJECT: "ios-app/TendPets.xcodeproj"
        XCODE_SCHEME: "TendPets"
        APP_STORE_APPLE_ID: "REPLACE_WITH_APP_STORE_APPLE_ID"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios-app"
          xcodegen generate
      - name: Set up provisioning profile settings
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Increment App Store build number
        script: |
          cd "$CM_BUILD_DIR/ios-app"
          if [ "$APP_STORE_APPLE_ID" = "REPLACE_WITH_APP_STORE_APPLE_ID" ]; then
            agvtool new-version -all "${BUILD_NUMBER:-1}"
          else
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
            agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
          fi
      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-app-store-release:
    name: Tend Pets iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tendpets.app
      vars:
        BUNDLE_ID: "com.tendpets.app"
        XCODE_PROJECT: "ios-app/TendPets.xcodeproj"
        XCODE_SCHEME: "TendPets"
        APP_STORE_APPLE_ID: "REPLACE_WITH_APP_STORE_APPLE_ID"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios-app"
          xcodegen generate
      - name: Set up provisioning profile settings
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Increment App Store build number
        script: |
          cd "$CM_BUILD_DIR/ios-app"
          if [ "$APP_STORE_APPLE_ID" = "REPLACE_WITH_APP_STORE_APPLE_ID" ]; then
            agvtool new-version -all "${BUILD_NUMBER:-1}"
          else
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
            agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
          fi
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: MANUAL
