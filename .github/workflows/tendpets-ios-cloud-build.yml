name: Tend Pets iOS Cloud Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/tendpets-ios-cloud-build.yml"
  push:
    branches:
      - main
    paths:
      - "ios-app/**"
      - ".github/workflows/tendpets-ios-cloud-build.yml"

jobs:
  simulator-build:
    name: iPhone 15 Simulator Build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep "iPhone 15"

      - name: Create iPhone 15 Simulator
        run: |
          set -euo pipefail
          DEVICE_TYPE=$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone 15 \(/ { print $2; exit }')
          RUNTIME=$(xcrun simctl list runtimes available | awk -F ' - ' '/iOS 18.6/ { print $NF; exit }')
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(xcrun simctl list runtimes available | awk -F ' - ' '/iOS 18.5/ { print $NF; exit }')
          fi
          if [ -z "$DEVICE_TYPE" ] || [ -z "$RUNTIME" ]; then
            echo "Unable to resolve iPhone 15 simulator device type or iOS runtime." >&2
            exit 1
          fi
          SIMULATOR_UDID=$(xcrun simctl create "TendPets iPhone 15" "$DEVICE_TYPE" "$RUNTIME")
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build for iPhone 15 Simulator
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild \
            -project TendPets.xcodeproj \
            -scheme TendPets \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -skipPackagePluginValidation \
            build | tee xcodebuild.log

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tendpets-xcodebuild-log
          path: ios-app/xcodebuild.log
