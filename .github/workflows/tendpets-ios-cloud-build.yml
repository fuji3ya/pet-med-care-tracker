name: Tend Pets iOS Cloud Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/tendpets-ios-cloud-build.yml"
  push:
    branches:
      - main
    paths:
      - "ios-app/**"
      - ".github/workflows/tendpets-ios-cloud-build.yml"

jobs:
  simulator-build:
    name: iPhone 15 Simulator Build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep "iPhone 15"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build for iPhone 15 Simulator
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild \
            -project TendPets.xcodeproj \
            -scheme TendPets \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -skipPackagePluginValidation \
            build | tee xcodebuild.log

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tendpets-xcodebuild-log
          path: ios-app/xcodebuild.log
