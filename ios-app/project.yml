name: TendPets
options:
  bundleIdPrefix: com.tendpets
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  TendPets:
    type: application
    platform: iOS
    sources:
      - TendPets/App
      - TendPets/Models
      - TendPets/Services
      - TendPets/Views
      - TendPets/Resources/Assets.xcassets
    resources:
      - TendPets/Resources/PrivacyInfo.xcprivacy
      - StoreKit/TendPets.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.starvingeffort.tendpets
        INFOPLIST_FILE: TendPets/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    scheme:
      testTargets: []
      storeKitConfiguration: StoreKit/TendPets.storekit
